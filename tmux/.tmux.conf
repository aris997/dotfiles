# ----- General -----
set -g prefix C-a
unbind C-b
bind C-a send-prefix          # press C-a twice to send a literal C-a to the shell

set -g mouse on
set -g base-index 1           # windows/panes start at 1, next to the prefix key
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0         # no delay after Esc, matters for vim inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ----- Splits & panes -----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z

# ----- Copy mode (vi keys) -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ----- Status bar -----
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green,bold]#S "
set -g status-right "#[fg=cyan]%Y %B %d %H:%M:%S %z"
setw -g window-status-current-style fg=black,bg=green,bold
